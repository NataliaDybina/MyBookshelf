spring:
  application:
    name: my-bookshelf
  # Local development: load variables from the project-root .env (see .env.example).
  config:
    import: optional:file:../.env[.properties]
  # The UI is in English: always use English messages (e.g. validation errors),
  # regardless of the browser or system language.
  web:
    locale: en
    locale-resolver: fixed
  mongodb:
    # Fallback keeps tests and startup working without a .env; real value comes from MONGODB_URI.
    uri: ${MONGODB_URI:mongodb://localhost:27017/bookshelf}
